<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevClub - Conversor de Moeda</title>
    <link rel="stylesheet" href="./CSS/style.css">
</head>
<body>
    <h1>Conversor de Moedas Simples</h1>

    <img src="./assets/IMG/logo.gif" alt="Logo-Moeda">

    <main>
        <label>
            Converter <b>de</b>
            <select>
                <option value="">R$ Real Brasileiro</option>
            </select>
        </label>

        <label>
            Converter <b>para</b>
            <select>
                <option value="">US$ Dólar Americano</option>
                <option value="">€ Euro</option>
            </select>
        </label>

          <label>
            Valor
            <input type="text" placeholder="Valor Convertido">
        </label>
    </main>

    <script src="./JS/script.js"></script>
</body>
</html>
