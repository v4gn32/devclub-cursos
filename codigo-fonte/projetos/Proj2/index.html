<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOF - Conversor de Moeda</title>
    <link rel="stylesheet" href="./CSS/style.css">
</head>
<body>
     <img class="logo-moeda" src="./assets/IMG/logo-moeda2.gif" alt="Logo-Moeda">

    <main>
        <label>
            Converter <b>de:</b>
            <select>
                <option value="">R$ Real Brasileiro</option>
            </select>
        </label>

        <label>
            Converter <b>para:</b>
            <select>
                <option value="">US$ Dólar Americano</option>
                <option value="">€ Euro</option>
            </select>
        </label>

          <label>
            Valor:
            <input type="text" placeholder="R$ 0,00">
        </label>

        <button>Converter</button>

        <section>
            <div>
                <img class="logo-brasil" src="./assets/IMG/brasil.png" alt="moeda-converter">
                <p>Real</p>
                <p>R$ 0,00</p>
            </div>

            <img class="seta" src="./assets/IMG/Vector.png" alt="seta">

            <div class=""><img src="./assets/IMG/usa.png" alt="moeda-convertida">
                <p>Dolar</p>
                <p>US$ 0,0</p>
            </div>
        </section>
    </main>

    <script src="./JS/script.js"></script>
</body>
</html>
